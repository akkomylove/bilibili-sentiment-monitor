{% extends "base.html" %}
{% block title %}数据治理 - B站舆情监控平台{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>🛡️ 数据治理面板</h1>
    <div class="d-flex align-items-center gap-2">
        <select class="form-select form-select-sm" id="governance-video-select" style="width: auto; min-width: 200px;">
            <option value="">全部视频评论</option>
        </select>
        <button class="btn btn-success btn-sm" onclick="triggerGovernance()"><i class="bi bi-play-fill"></i> 执行治理流水线</button>
    </div>
</div>

<div id="toast-container" style="position:fixed;top:20px;right:20px;z-index:9999;"></div>

<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-bg-success"><div class="card-body">
            <h5>完整率</h5><p class="display-6" id="gov-completeness">--</p>
        </div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-info"><div class="card-body">
            <h5>去重率</h5><p class="display-6" id="gov-dedup">--</p>
        </div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-warning"><div class="card-body">
            <h5>异常率</h5><p class="display-6" id="gov-anomaly">--</p>
        </div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-primary"><div class="card-body">
            <h5>综合评分</h5><p class="display-6" id="gov-overall">--</p>
        </div></div>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header">📊 数据质量指标</div>
            <div class="card-body"><div id="chart-quality-radar" style="height: 350px;"></div></div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>📋 治理规则列表</span>
                <button class="btn btn-primary btn-sm" onclick="showAddRuleModal()"><i class="bi bi-plus"></i> 添加规则</button>
            </div>
            <div class="card-body" id="rules-container" style="max-height: 350px; overflow-y: auto;">
                <p class="text-muted">加载中...</p>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
    <span>🔗 数据血缘链路</span>
    <small id="lineage-summary" class="text-muted">加载中...</small>
</div>
            <div class="card-body"><div id="chart-lineage" style="height: 400px;"></div></div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-header">📝 治理操作日志</div>
            <div class="card-body">
                <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-sm table-striped">
                        <thead><tr><th>时间</th><th>目标</th><th>动作</th><th>规则ID</th></tr></thead>
                        <tbody id="logs-table-body"><tr><td colspan="4" class="text-center text-muted">加载中...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="ruleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加治理规则</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">规则名称</label>
                    <input type="text" class="form-control" id="new-rule-name" placeholder="如：评论长度校验">
                </div>
                <div class="mb-3">
                    <label class="form-label">规则类型</label>
                    <input type="text" class="form-control" id="new-rule-type" placeholder="如：length_check">
                </div>
                <div class="mb-3">
                    <label class="form-label">治理阶段</label>
                    <select class="form-select" id="new-rule-phase">
                        <option value="format_check">接入校验</option>
                        <option value="dedup">去重</option>
                        <option value="clean">清洗</option>
                        <option value="desensitize">脱敏</option>
                        <option value="quality">质量</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">规则配置（JSON，可选）</label>
                    <input type="text" class="form-control" id="new-rule-config" placeholder='{"max_length": 2000}'>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addRule()">确认添加</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var API_BASE = '/api/v1';

function showToast(msg, type) {
    type = type || 'info';
    var bg = type === 'success' ? 'bg-success' : type === 'danger' ? 'bg-danger' : type === 'warning' ? 'bg-warning' : 'bg-info';
    var container = document.getElementById('toast-container');
    var el = document.createElement('div');
    el.className = 'toast align-items-center text-white ' + bg + ' border-0 mb-2';
    el.setAttribute('role', 'alert');
    el.innerHTML = '<div class="d-flex"><div class="toast-body">' + msg + '</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
    container.appendChild(el);
    var toast = new bootstrap.Toast(el, { delay: 3000 });
    toast.show();
    el.addEventListener('hidden.bs.toast', function() { el.remove(); });
}

async function fetchJSON(url, opts) {
    var resp = await fetch(API_BASE + url, opts || {});
    if (!resp.ok) {
        var err = await resp.text();
        throw new Error(err || ('HTTP ' + resp.status));
    }
    return await resp.json();
}

async function apiPost(url) {
    return await fetchJSON(url, { method: 'POST' });
}

function setPlaceholder(chart, msg) {
    chart.clear();
    chart.setOption({
        title: { text: msg, left: 'center', top: 'center', textStyle: { color: '#999', fontSize: 14 } },
        xAxis: { show: false }, yAxis: { show: false }, series: []
    });
}

document.addEventListener('DOMContentLoaded', async function () {
    window._radarChart = echarts.init(document.getElementById('chart-quality-radar'));
    window._lineageChart = echarts.init(document.getElementById('chart-lineage'));
    setPlaceholder(window._radarChart, '加载中...');
    setPlaceholder(window._lineageChart, '加载中...');

    await loadVideoOptions();
    loadQuality();
    loadRules();
    loadLineage();
    loadLogs();
});

async function loadVideoOptions() {
    try {
        var data = await fetchJSON('/videos/?page=1&page_size=100');
        var select = document.getElementById('governance-video-select');
        if (select && data.items) {
            data.items.forEach(function(v) {
                var opt = document.createElement('option');
                opt.value = v.bvid;
                opt.textContent = (v.title || v.bvid).substring(0, 40);
                select.appendChild(opt);
            });
        }
    } catch(e) {}
}

async function loadQuality() {
    try {
        var q = await fetchJSON('/governance/quality-report');
        document.getElementById('gov-completeness').textContent = (q.completeness_rate || 0).toFixed(1) + '%';
        document.getElementById('gov-dedup').textContent = (q.dedup_rate || 0).toFixed(1) + '%';
        document.getElementById('gov-anomaly').textContent = (q.anomaly_rate || 0).toFixed(1) + '%';
        document.getElementById('gov-overall').textContent = (q.overall_score || 0).toFixed(1);

        var radarChart = window._radarChart;
        if (!radarChart) return;
        radarChart.setOption({
            title: { show: false },
            radar: {
                indicator: [
                    { name: '完整率', max: 100 },
                    { name: '去重率(逆)', max: 100 },
                    { name: '时效性', max: 100 },
                    { name: '综合', max: 100 }
                ],
                shape: 'circle'
            },
            series: [{
                type: 'radar',
                data: [{
                    value: [q.completeness_rate || 0, 100 - (q.dedup_rate || 0), q.timeliness_score || 0, q.overall_score || 0],
                    name: '质量评分',
                    areaStyle: { color: 'rgba(24,144,255,0.2)' }
                }]
            }]
        });
    } catch(e) {
        document.getElementById('gov-completeness').textContent = '--';
        document.getElementById('gov-dedup').textContent = '--';
        document.getElementById('gov-anomaly').textContent = '--';
        document.getElementById('gov-overall').textContent = '--';
    }
}

async function loadRules() {
    try {
        var rules = await fetchJSON('/governance/rules');
        var html = '';
        if (rules.length === 0) {
            html = '<p class="text-muted text-center py-3">暂无规则，请添加治理规则</p>';
        } else {
            rules.forEach(function(r) {
                var badge = '';
                switch(r.phase) {
                    case 'format_check': badge = '<span class="badge bg-primary">接入校验</span>'; break;
                    case 'dedup': badge = '<span class="badge bg-warning">去重</span>'; break;
                    case 'clean': badge = '<span class="badge bg-info">清洗</span>'; break;
                    case 'desensitize': badge = '<span class="badge bg-danger">脱敏</span>'; break;
                    case 'quality': badge = '<span class="badge bg-success">质量</span>'; break;
                    default: badge = '<span class="badge bg-secondary">' + r.phase + '</span>';
                }
                html += '<div class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded">';
                html += '<div><strong>' + r.rule_name + '</strong> ' + badge + '<br><small class="text-muted">类型: ' + r.rule_type + '</small></div>';
                html += '<div class="btn-group btn-group-sm">';
                html += '<button class="btn btn-outline-' + (r.is_active ? 'success' : 'secondary') + '" onclick="toggleRule(' + r.id + ')" title="切换状态">' + (r.is_active ? '✅' : '⛔') + '</button>';
                html += '<button class="btn btn-outline-danger" onclick="deleteRule(' + r.id + ')" title="删除"><i class="bi bi-trash"></i></button>';
                html += '</div></div>';
            });
        }
        document.getElementById('rules-container').innerHTML = html;
    } catch(e) {
        document.getElementById('rules-container').innerHTML = '<p class="text-danger">加载失败: ' + e.message + '</p>';
    }
}

async function loadLineage() {
    var chart = window._lineageChart;
    if (!chart) return;
    try {
        var data = await fetchJSON('/governance/lineage');

        var targetNameMap = {
            'format_check': '接入校验', 'dedup': '去重处理',
            'clean': '数据清洗', 'desensitize': '敏感脱敏',
            'raw_comments': '原始评论', 'ready': '分析就绪'
        };

        var latestByStage = {};
        data.forEach(function(item) {
            var stageName = targetNameMap[item.target_id] || item.transform_step;
            latestByStage[stageName] = item.executed_at;
        });

        var execCount = Object.keys(latestByStage).length;
        var latestTime = '';
        var maxTime = data.length > 0 ? data[data.length - 1].executed_at : '';
        if (maxTime) {
            var d = new Date(maxTime.replace(' ', 'T'));
            latestTime = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        document.getElementById('lineage-summary').textContent =
            '共 ' + data.length + ' 条记录，最近执行: ' + (latestTime || '暂无');

        var stages = [
            { name: 'B站API', x: 50, color: '#00a1d6' },
            { name: '原始评论', x: 150, color: '#8c8c8c' },
            { name: '接入校验', x: 250, color: '#1890ff' },
            { name: '去重处理', x: 350, color: '#722ed1' },
            { name: '数据清洗', x: 450, color: '#fa8c16' },
            { name: '敏感脱敏', x: 550, color: '#eb2f96' },
            { name: '分析就绪', x: 650, color: '#52c41a' },
        ];

        var nodes = [];
        var edges = [];

        stages.forEach(function(s, idx) {
            var execTime = latestByStage[s.name] || '';
            var timeLabel = '';
            if (execTime) {
                var ed = new Date(execTime.replace(' ', 'T'));
                timeLabel = '\n{b|' + ed.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'}) + '}';
            }
            var hasExecuted = !!execTime;

            nodes.push({
                name: s.name,
                x: s.x,
                y: 180,
                symbol: 'roundRect',
                symbolSize: hasExecuted ? [100, 52] : [90, 36],
                itemStyle: {
                    color: s.color,
                    borderRadius: 18,
                    shadowBlur: hasExecuted ? 16 : 8,
                    shadowColor: hasExecuted ? s.color : (s.color + '40'),
                    shadowOffsetY: 2
                },
                label: {
                    show: true,
                    color: '#fff',
                    formatter: '{a|' + s.name + '}' + timeLabel,
                    rich: {
                        a: { fontSize: 12, fontWeight: 'bold', color: '#fff', lineHeight: 18 },
                        b: { fontSize: 10, color: '#ffffffcc', lineHeight: 14 }
                    }
                },
                _execTime: execTime
            });

            if (idx > 0) {
                var edgeColor = hasExecuted ? s.color : '#bfbfbf';
                edges.push({
                    source: stages[idx - 1].name,
                    target: s.name,
                    lineStyle: { color: edgeColor, width: hasExecuted ? 3 : 2, curveness: 0 },
                    symbol: ['none', 'arrow'],
                    symbolSize: 8
                });
            }
        });

        chart.clear();
        chart.setOption({
            title: { show: false },
            tooltip: {
                formatter: function(params) {
                    if (params.dataType === 'node') {
                        var node = nodes.find(function(n) { return n.name === params.name; });
                        var timeInfo = node && node._execTime ? '<br/>执行时间: ' + node._execTime : '';
                        var stage = stages.find(function(s) { return s.name === params.name; });
                        return '<div style="padding:6px 10px;"><strong style="color:' + (stage ? stage.color : '#333') + ';">' + params.name + '</strong>' + timeInfo + '<br/><span style="font-size:12px;color:#666;">数据治理流水线阶段</span></div>';
                    }
                    return '';
                }
            },
            series: [{
                type: 'graph',
                layout: 'none',
                roam: false,
                data: nodes,
                edges: edges,
                label: { show: true },
                lineStyle: { curveness: 0 },
                emphasis: {
                    focus: 'adjacency',
                    itemStyle: { shadowBlur: 24, shadowColor: 'rgba(0,0,0,0.3)' }
                }
            }]
        });
    } catch(e) {
        if (chart) {
            setPlaceholder(chart, '加载失败');
        }
    }
}

async function loadLogs() {
    try {
        var logs = await fetchJSON('/governance/logs?page=1&page_size=50');
        var html = '';
        if (logs.length === 0) {
            html = '<tr><td colspan="4" class="text-center text-muted">暂无日志，请执行治理流水线</td></tr>';
        } else {
            logs.forEach(function(l) {
                html += '<tr><td>' + (l.executed_at || '').substring(0,19) + '</td><td>' + l.target_type + '#' + l.target_id + '</td><td><code>' + l.action + '</code></td><td>' + (l.rule_id || '--') + '</td></tr>';
            });
        }
        document.getElementById('logs-table-body').innerHTML = html;
    } catch(e) {
        document.getElementById('logs-table-body').innerHTML = '<tr><td colspan="4" class="text-center text-danger">加载失败</td></tr>';
    }
}

async function triggerGovernance() {
    var btn = document.querySelector('button[onclick="triggerGovernance()"]');
    var videoSelect = document.getElementById('governance-video-select');
    var videoBvid = videoSelect ? videoSelect.value : '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> 执行中...';
    try {
        var url = '/governance/trigger';
        if (videoBvid) url += '?video_bvid=' + encodeURIComponent(videoBvid);
        var result = await apiPost(url);

        var phases = result.results || {};
        var phaseDetails = [];
        for (var phase in phases) {
            var p = phases[phase];
            phaseDetails.push(p.label + ': ' + p.processed + '条');
        }

        var scanned = result.scanned_total || 0;
        var processed = result.total_processed || 0;
        var msg = '✅ 治理完成！扫描 ' + scanned + ' 条';
        if (processed > 0) {
            msg += '，处理 ' + processed + ' 条 (' + phaseDetails.join(' / ') + ')';
        } else if (scanned > 0) {
            msg += '，数据质量良好，无需处理';
        } else {
            msg += '，无数据可处理';
        }
        showToast(msg, 'success');

        setTimeout(function() {
            loadQuality();
            loadRules();
            loadLineage();
            loadLogs();
        }, 1500);
    } catch(e) {
        showToast('❌ 触发失败: ' + e.message, 'danger');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-play-fill"></i> 执行治理流水线';
    }
}

async function toggleRule(ruleId) {
    try {
        await fetch(API_BASE + '/governance/rules/' + ruleId + '/toggle', { method: 'PUT' });
        showToast('规则状态已切换', 'success');
        loadRules();
    } catch(e) {
        showToast('操作失败: ' + e.message, 'danger');
    }
}

async function deleteRule(ruleId) {
    if (!confirm('确定删除该规则吗？')) return;
    try {
        await fetch(API_BASE + '/governance/rules/' + ruleId, { method: 'DELETE' });
        showToast('规则已删除', 'success');
        loadRules();
    } catch(e) {
        showToast('删除失败: ' + e.message, 'danger');
    }
}

function showAddRuleModal() {
    document.getElementById('new-rule-name').value = '';
    document.getElementById('new-rule-type').value = '';
    document.getElementById('new-rule-phase').value = 'format_check';
    document.getElementById('new-rule-config').value = '';
    var modal = new bootstrap.Modal(document.getElementById('ruleModal'));
    modal.show();
}

async function addRule() {
    var name = document.getElementById('new-rule-name').value.trim();
    var type = document.getElementById('new-rule-type').value.trim();
    var phase = document.getElementById('new-rule-phase').value;
    var config = document.getElementById('new-rule-config').value.trim();
    if (!name || !type) { showToast('请填写规则名称和类型', 'warning'); return; }
    try {
        var url = '/governance/rules?rule_name=' + encodeURIComponent(name) + '&rule_type=' + encodeURIComponent(type) + '&phase=' + encodeURIComponent(phase);
        if (config) url += '&rule_config=' + encodeURIComponent(config);
        await apiPost(url);
        bootstrap.Modal.getInstance(document.getElementById('ruleModal')).hide();
        showToast('规则添加成功', 'success');
        loadRules();
    } catch(e) {
        showToast('添加失败: ' + e.message, 'danger');
    }
}
</script>
{% endblock %}
